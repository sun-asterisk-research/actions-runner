name: Publish Runner Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/actions-runner
  RUNNER_VERSION: 2.337.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RUNNER_VERSION}}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION}}
            RUNNER_CONTAINER_HOOKS_VERSION=0.5.0
            TARGETOS=linux
            TARGETARCH=amd64
            DOCKER_VERSION=24.0.6
            BUILDX_VERSION=0.11.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
